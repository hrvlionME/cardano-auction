    <title>Auction</title>
    <!--
      Inlined as a data URI rather than served as a file: it costs no request,
      cannot 404, and needs no MIME entry in serve.ts's table. The browser asks
      for /favicon.ico unprompted, and that 404 was the only line in an
      otherwise clean console.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d8bf5'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3E%E2%82%B3%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
